---
- name: Create namespace | {{ argocd.name }}
  kubernetes.core.k8s:
    kind: Namespace
    api_version: v1
    name: "{{ argocd.namespace }}"
    state: present
  run_once: true

- name: Download manifest from gitops repo | {{ argocd.name }}
  ansible.builtin.uri:
    url: "{{ argocd.manifest_url }}/{{ argocd.manifest_ref }}/{{ argocd.manifest_file }}"
    return_content: true
  register: argocd_manifest
  run_once: true

- name: Apply manifest to the cluster | {{ argocd.name }}
  kubernetes.core.k8s:
    namespace: "{{ argocd.namespace }}"
    state: present
    definition: "{{ argocd_manifest.content | from_yaml_all | list }}"
  run_once: true

- name: Deploy app-of-core-apps
  ansible.builtin.include_tasks: "argocd-app-of-core-apps.yaml"
  when: argocd.deploy

- name: Deploy app-of-apps
  ansible.builtin.include_tasks: "argocd-app-of-apps.yaml"
  when: argocd.deploy
